# A local PostgreSQL for development. Start it with:  docker compose up -d
# (No Docker? `cd backend && npx prisma dev --name claims --detach` gives you a local database too. See README.md.)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - '5432:5432'
    volumes:
      - claims-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U claims -d claims']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  claims-db:
